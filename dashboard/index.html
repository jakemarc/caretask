<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marc Innotech — Clinician Dashboard</title>
    <script>
      // Apply the saved theme (mode + color theme) before first
      // paint so there is no flash of the wrong palette. Mirrors
      // src/lib/theme.ts: keys `marcinnotech-theme` (light/dark,
      // default light) and `marcinnotech-color-theme` (default
      // teal), applied as data-theme / data-color-theme on <html>.
      // App.tsx re-applies both from React state on mount.
      (function () {
        try {
          var mode = localStorage.getItem("marcinnotech-theme");
          document.documentElement.dataset.theme =
            mode === "dark" ? "dark" : "light";
          var color = localStorage.getItem("marcinnotech-color-theme");
          var known = ["teal", "ocean", "forest", "sunset", "plum"];
          document.documentElement.dataset.colorTheme =
            known.indexOf(color) >= 0 ? color : "teal";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.colorTheme = "teal";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
